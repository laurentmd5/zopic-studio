version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: zopic_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: zopic
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: zopic_redis
    restart: always
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data

  minio:
    image: minio/minio
    container_name: zopic_minio
    restart: always
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9002:9000"
      - "9003:9001"
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"

  qdrant:
    image: qdrant/qdrant
    container_name: zopic_qdrant
    restart: always
    ports:
      - "6335:6333"
      - "6336:6334"
    volumes:
      - qdrant_data:/qdrant/storage

  backend:
    image: zopic-studio-backend:${DOCKER_IMAGE_TAG:-latest}
    container_name: zopic_backend
    restart: always
    ports:
      - "8000:8000"
    depends_on:
      - db
      - redis
      - minio
      - qdrant
    env_file:
      - .env
    environment:
      - AI_API_URL=http://ai-api:8001

  ai-api:
    build:
      context: ./worker_ai
    container_name: zopic_ai_api
    restart: always
    ports:
      - "8001:8001"
    depends_on:
      - redis
      - minio
      - qdrant
    environment:
      - REDIS_URL=redis://redis:6379/0
      - QDRANT_URL=http://qdrant:6333
      - S3_ENDPOINT_URL=http://minio:9000
      - S3_ACCESS_KEY=minioadmin
      - S3_SECRET_KEY=minioadmin
      - S3_BUCKET_NAME=zopic-studio

  ai-worker:
    build:
      context: ./worker_ai
    container_name: zopic_ai_worker
    restart: always
    command: uv run arq app.worker.WorkerSettings
    depends_on:
      - redis
      - minio
      - qdrant
    environment:
      - REDIS_URL=redis://redis:6379/0
      - QDRANT_URL=http://qdrant:6333
      - S3_ENDPOINT_URL=http://minio:9000
      - S3_ACCESS_KEY=minioadmin
      - S3_SECRET_KEY=minioadmin
      - S3_BUCKET_NAME=zopic-studio

volumes:
  postgres_data:
  redis_data:
  minio_data:
  qdrant_data:
