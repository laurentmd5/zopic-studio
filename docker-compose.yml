version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: zopic_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: zopic
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: zopic_redis
    restart: always
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data

  minio:
    image: minio/minio
    container_name: zopic_minio
    restart: always
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9002:9000"
      - "9003:9001"
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"

  qdrant:
    image: qdrant/qdrant
    container_name: zopic_qdrant
    restart: always
    ports:
      - "6335:6333"
      - "6336:6334"
    volumes:
      - qdrant_data:/qdrant/storage

  backend:
    image: zopic-studio-backend:${DOCKER_IMAGE_TAG:-latest}
    container_name: zopic_backend
    restart: always
    ports:
      - "8000:8000"
    depends_on:
      - db
      - redis
      - minio
      - qdrant
    env_file:
      - .env

volumes:
  postgres_data:
  redis_data:
  minio_data:
  qdrant_data:
